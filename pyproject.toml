[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-agents"
version = "0.1.0"
description = "Swift Serve AI Ascend: autonomous client acquisition (prospecting, demo websites, GoHighLevel Voice AI cold calls)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3.0",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ascend = "ascend_agents.cli:main"

[tool.setuptools.packages.find]
include = ["ascend_agents*"]

[tool.setuptools.package-data]
ascend_agents = ["sites/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
